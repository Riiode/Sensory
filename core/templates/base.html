<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sensory{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'home' %}" class="brand">🎬 Sensory</a>
        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'gallery' %}">Gallery</a>
            <a href="{% url 'gallery' %}?type=image">Images</a>
            <a href="{% url 'gallery' %}?type=video">Videos</a>
            <a href="{% url 'gallery' %}?type=audio">Audio</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Bincom Python Class &copy; 2025 · Django Multimedia Project</p>
    </footer>
</body>
</html>
